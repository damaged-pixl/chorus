org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# No resource shrinking surprises in a deliberately tiny app.
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true
# R8 full mode: shrinks harder than compat mode (assumes no reflection on
# unkept classes, drops unused attributes). Media3's reflective entry points
# are kept explicitly in app/proguard-rules.pro.
android.enableR8.fullMode=true